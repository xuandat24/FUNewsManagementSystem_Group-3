spring.application.name=funms-manage-api
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FUNMS_Group3;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_ACCOUNT}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.default-property-inclusion=non_null

# Swagger / OpenAPI (springdoc)
# http://localhost:8080/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# JWT Configuration
jwt.secret=FUNewsManagementSystemSecretKey2026SBA301FPTUniversitySecuredKey
jwt.expiration=3600000

# CORS Origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# kết nối với ENV
spring.config.import=optional:file:./.env[.properties]
